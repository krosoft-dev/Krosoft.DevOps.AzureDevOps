parameters:
  - name: nodeVersion
    type: string
  - name: buildMode
    type: string
  - name: workingDirectory
    type: string
    default: "."
  - name: viteBase
    type: string
    default: "/"
  # Script npm à lancer. Par défaut `build` : le build applicatif vite.
  - name: buildScript
    type: string
    default: "build"
  # Les arguments --mode/--base ne valent que pour vite. Un autre builder
  # (storybook…) les refuse : passer `false` pour l'appeler sans argument.
  - name: passViteArgs
    type: boolean
    default: true

steps:
  # - script: ls -la $(Build.SourcesDirectory)
  #   displayName: "Check sources directory"

  # - script: ls -la ${{ parameters.workingDirectory }}
  #   displayName: "Check working directory"

  - task: UseNode@1
    displayName: "Use Node.js ${{ parameters.nodeVersion }}"
    inputs:
      version: ${{ parameters.nodeVersion }}

  - script: npm ci --include=dev
    displayName: Install dependencies
    workingDirectory: ${{ parameters.workingDirectory }}

  # - script: ls -la ${{ parameters.workingDirectory }}/node_modules
  #   displayName: "Check node_modules directory"

  - ${{ if parameters.passViteArgs }}:
      - script: npm run ${{ parameters.buildScript }} -- --mode=${{ parameters.buildMode }} --base=${{ parameters.viteBase }}
        displayName: Build '${{ parameters.buildMode }}' version
        workingDirectory: ${{ parameters.workingDirectory }}
  - ${{ else }}:
      - script: npm run ${{ parameters.buildScript }}
        displayName: Build '${{ parameters.buildMode }}' version
        workingDirectory: ${{ parameters.workingDirectory }}
